<!--
  FireDog's blank page. Firefox shows chrome://browser/content/blanktab.html
  for about:newtab when the new tab page is off (browser.newtabpage.enabled,
  the NewTabPage policy) and for a blank homepage; repack.mjs overrides that
  URL with this file. It is drawn in Progate's design (colors, type, spacing
  from Progate's design tokens) and needs nothing from the network: the
  styles and the illustration (Progate's Ninja Wanko, from
  @progate/illustrations' wanko-laptop.svg) are inline. It names no site:
  FireDog opens whatever the learner serves, at whatever address.
-->

    <style>
      :root {
        /* Progate design tokens: baseBgColor, navy, primaryTextColor,
           grayDark. */
        --base-bg: #f9fbfe;
        --navy: #2b546a;
        --text: #5876a3;
        --gray-dark: #8491a5;
        --font: "LINE Seed JP", "Noto Sans JP", "Hiragino Sans", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 16px;
        background: var(--base-bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 14px;
        line-height: 1.714;
        letter-spacing: 0.04em;
      }

      main {
        width: 100%;
        max-width: 480px;
        text-align: center;
      }

      .wanko {
        display: block;
        width: 160px;
        height: auto;
        margin: 0 auto 24px;
      }

      h1 {
        margin: 0 0 8px;
        color: var(--navy);
        font-size: 20px;
        font-weight: 700;
        line-height: 1.5;
      }

      p {
        margin: 0;
      }

    </style>
